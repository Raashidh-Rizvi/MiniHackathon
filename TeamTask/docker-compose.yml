version: '3.8'

services:
  db:
    image: postgres:16
    container_name: teamtask-postgres
    environment:
      POSTGRES_USER: teamtask_user
      POSTGRES_PASSWORD: teamtask_password
      POSTGRES_DB: teamtask
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
